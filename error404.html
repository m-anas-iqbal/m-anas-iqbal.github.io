<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Anas Iqbal</title>
  <link rel="icon" href="assets/img/logo.png">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <link href="assets/vendor/css/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(15, 23, 42, 0.75);
      --primary: #0d9488;
      --accent: #2dd4bf;
      --text-heading: #f8fafc;
      --text-body: #94a3b8;
      --border: rgba(148, 163, 184, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-body);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(13, 148, 136, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(45, 212, 191, 0.08) 0%, transparent 50%);
    }

    .error-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      background: linear-gradient(135deg, #2dd4bf, #0d9488, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-heading);
      margin-bottom: 12px;
    }

    .error-desc {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-body);
      margin-bottom: 28px;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      font-size: 0.92rem;
      font-weight: 600;
      color: #042f2e;
      background: linear-gradient(135deg, #2dd4bf, #14b8a6);
      border: none;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(20, 184, 166, 0.35);
      transition: all 0.25s ease;
    }

    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(20, 184, 166, 0.45);
      color: #022c22;
    }

    .status-tag {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      padding: 4px 10px;
      background: rgba(13, 148, 136, 0.15);
      color: #2dd4bf;
      border-radius: 6px;
      margin-bottom: 20px;
      border: 1px solid rgba(45, 212, 191, 0.25);
    }
  </style>
</head>

<body>
  <div class="error-card">
    <span class="status-tag">HTTP 404 • ROUTE_NOT_FOUND</span>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The requested architecture or page does not exist or has been relocated. Let's get you back to the executive portfolio.</p>
    <a href="index.html" class="home-btn">
      <i class="bi bi-arrow-left"></i> Back to Portfolio
    </a>
  </div>
</body>

</html>
